name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aptitude
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aptitude
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aptitude"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aptitude:ci@localhost:5432/aptitude
      DIRECT_URL: postgresql://aptitude:ci@localhost:5432/aptitude
      SESSION_SECRET: ci-session-secret-ci-session-secret-ci-session
      DOB_PEPPER: ci-dob-pepper-ci-dob-pepper-ci-dob-pepper-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma validate
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    # Smoke-test that both image targets build (no push).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
