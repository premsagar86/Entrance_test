name: Deploy

# Runs after CI succeeds on main. Builds + pushes images to GHCR, then deploys over SSH.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Compute tag and image name
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          push: true
          build-args: NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push tools (migrate) image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          build-args: NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-tools
          cache-from: type=gha

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_TAG: ${{ needs.build-push.outputs.tag }}
          NEW_SHA: ${{ needs.build-push.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: NEW_TAG,NEW_SHA,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/aptitude
            PREV_TAG="$(cat .deployed_tag 2>/dev/null || echo latest)"

            git fetch --all --quiet
            git checkout --quiet --detach "$NEW_SHA"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            healthy() {
              for i in $(seq 1 30); do
                if docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q '"ok"'; then return 0; fi
                sleep 3
              done
              return 1
            }

            release() {
              export TAG="$1"
              docker compose --profile tools pull app migrate
              docker compose up -d db
              docker compose --profile tools run --rm migrate
              docker compose up -d
            }

            # Back up first, if the stack is already running.
            if docker compose ps --status running db | grep -q db; then
              scripts/backup.sh /var/backups/aptitude 14
            fi

            if release "$NEW_TAG" && healthy; then
              echo "$NEW_TAG" > .deployed_tag
              docker image prune -f >/dev/null
              echo "Deployed $NEW_TAG"
            else
              echo "Deploy of $NEW_TAG failed health check; rolling back to $PREV_TAG" >&2
              export TAG="$PREV_TAG"
              docker compose up -d
              exit 1
            fi
