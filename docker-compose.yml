services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aptitude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aptitude
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptitude"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published: reachable only on the internal network.

  # One-shot tools. Run on demand:
  #   docker compose run --rm migrate                                  (apply migrations)
  #   docker compose run --rm migrate npx tsx prisma/seed.ts           (create the admin)
  #   docker compose run --rm migrate npx tsx scripts/cleanup-attempts.ts
  migrate:
    build:
      context: .
      target: tools
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aptitude:${POSTGRES_PASSWORD}@db:5432/aptitude
      DIRECT_URL: postgresql://aptitude:${POSTGRES_PASSWORD}@db:5432/aptitude

  app:
    build:
      context: .
      target: run
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aptitude:${POSTGRES_PASSWORD}@db:5432/aptitude
      DIRECT_URL: postgresql://aptitude:${POSTGRES_PASSWORD}@db:5432/aptitude
      STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
